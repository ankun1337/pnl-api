[project]
name = "pnlapi"
version = "0.1.0"
description = "股票盈亏 API：无状态微服务，输入持仓、现场取 J-Quants 日终价、返回盈亏"
requires-python = ">=3.12,<3.13"

# 技术栈固定（提示词第 2 节）："没有别的了"。
# 刻意不引入 pydantic-settings——config.py 手工解析 .env（十行以内的事）。
dependencies = [
    "httpx>=0.27,<0.29",
    "pydantic>=2.7,<3",
    "fastapi>=0.111,<1",
    "uvicorn>=0.30,<1",
]

[dependency-groups]
dev = [
    "pytest>=8.2,<9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pnlapi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
